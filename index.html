<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nullpoint</title>
<meta name="description" content="A first-person psychological horror game in your browser. An AI asks four questions, then tests your answers.">
<link rel="preload" href="fonts/vt323.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="view" width="320" height="180" aria-label="First-person view of the room"></canvas>
  <div id="vignette"></div>
  <div id="subtitle" role="status" aria-live="polite"></div>
  <div id="prompt"></div>
  <div id="hud"></div>
  <div id="lockhint" hidden>Click to look around</div>
  <div id="brief" hidden></div>
  <div id="note" hidden><h2 id="noteTitle"></h2><p id="noteText"></p><small>Press E to put it down</small></div>
</div>
<section id="terminal" hidden>
  <div id="out" aria-live="polite"></div>
  <form id="line"><label for="in">&gt;</label><input id="in" autocomplete="off" spellcheck="false" autocapitalize="off"></form>
  <button id="pixel" aria-label="A green pixel"></button>
</section>
<section id="game" hidden></section>
<section id="ending" hidden></section>
<section id="title">
  <h1 id="logo" aria-label="Nullpoint">ᚠᚢᚦᚨᚱᚲᚷᚹᚺ</h1>
  <div id="titleActions"></div>
  <p class="warn">Best with headphones. Contains flickering static, a figure that follows you, and questions about hurting people.</p>
  <nav><a href="https://github.com/alex-gamero" target="_blank" rel="noopener">GitHub</a><a href="https://www.linkedin.com/in/alex-gamero" target="_blank" rel="noopener">LinkedIn</a></nav>
</section>
<section id="touch"><p>Nullpoint needs a keyboard and a mouse. Open it on a laptop or PC.</p></section>
<script type="module" src="js/main.js"></script>
</body>
</html>
